version: 2

models:
    - name: fct_order_lines
      description: >
        One row per source transaction line. The same product can appear
        more than once on an invoice. Includes cancellations and guest purchases.
      columns:
        - name: invoice_no
          description: Invoice number. Prefix "C" marks a cancellation.
          tests:
            - not_null
        - name: stock_code
          description: Product code; joins to dim_products.
          tests:
            - not_null
        - name: invoice_date
          description: Date and time of the transaction.
          tests:
            - not_null
        - name: quantity
          description: Units on this line. Negative for cancellations and some stock adjustments.
          tests:
            - not_null
        - name: unit_price
          description: Price per unit paid on this line, in GBP.
          tests:
            - not_null
        - name: line_value
          description: quantity × unit_price. Negative for cancellations.
          tests:
            - not_null
        - name: load_date
          description: Date the ingestion run loaded this row (the run date, not the transaction date).
          tests:
            - not_null

    - name: fct_orders
      description: One row per invoice, aggregated from its lines.
      columns:
        - name: invoice_no
          description: Invoice number. Prefix "C" marks a cancellation.
          tests:
            - not_null
            - unique
        - name: invoice_date
          description: Invoice date and time (latest line timestamp; lines on one invoice share a calendar date).
          tests:
            - not_null
        - name: order_total
          description: Sum of line values. Negative only for cancellations.
          tests:
            - not_null
        - name: order_quantity
          description: Sum of line quantities.
          tests:
            - not_null
        - name: load_date
          description: Latest load date across the invoice's lines.
          tests:
            - not_null